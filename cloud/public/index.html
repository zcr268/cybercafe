<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberCafe 云管理</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; }
  header { padding: 14px 20px; background: #1e293b; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #334155; }
  header h1 { font-size: 18px; margin: 0; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .col-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .batch-table th, .batch-table td { font-size: 12px; padding: 6px 4px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 15px; color: #94a3b8; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #1d4ed8; }
  button.gray { background: #475569; } button.gray:hover { background: #64748b; }
  button.red { background: #b91c1c; } button.red:hover { background: #991b1b; }
  button.sm { padding: 3px 8px; font-size: 12px; }
  select, input[type=text], input[type=password] { background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #334155; vertical-align: top; }
  th { color: #94a3b8; font-weight: 500; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .dot.on { background: #22c55e; } .dot.off { background: #64748b; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
  .state { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .state.online { background: #14532d; color: #86efac; }
  .state.deploying { background: #713f12; color: #fde047; }
  .state.failed { background: #7f1d1d; color: #fca5a5; }
  .state.queued { background: #1e3a8a; color: #93c5fd; }
  .state.idle, .state.stopped, .state.offline { background: #334155; color: #cbd5e1; }
  #login { max-width: 360px; margin: 15vh auto; }
  #logbox { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; height: 180px; overflow-y: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; }
  #chatbox { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; height: 320px; overflow-y: auto; }
  .msg { margin: 8px 0; padding: 8px 10px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.5; }
  .msg.user { background: #2563eb; margin-left: auto; }
  .msg.bot { background: #334155; }
  .msg .perf { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #475569; font-size: 11px; color: #94a3b8; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
  .chatin { display: flex; gap: 8px; margin-top: 10px; }
  .chatin input { flex: 1; }
  .toast { position: fixed; top: 14px; right: 14px; background: #065f46; padding: 10px 14px; border-radius: 8px; display: none; z-index: 9; font-size: 13px; max-width: 60vw; word-break: break-all; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  a { color: #60a5fa; }
  .bar { background: #0f172a; border: 1px solid #334155; border-radius: 4px; height: 15px; position: relative; margin: 3px 0; min-width: 150px; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: #16a34a; transition: width .5s; }
  .bar.warn > i { background: #d97706; }
  .bar.crit > i { background: #dc2626; }
  .bar.blue > i { background: #2563eb; }
  .bar.okgreen > i { background: #16a34a; }
  .bar > span { position: absolute; inset: 0; font-size: 10px; line-height: 15px; text-align: center; color: #e2e8f0; font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <h1>☁️ CyberCafe 云管理</h1>
  <span class="spacer"></span>
  <button class="gray sm" id="btnBatch">批次安装码</button>
  <button class="gray sm" id="btnAddDev">+ 添加设备</button>
  <button class="gray sm" id="btnLogout">退出</button>
</header>

<div id="login" class="card" style="display:none">
  <h2>管理员登录</h2>
  <p style="color:#94a3b8;font-size:13px">输入 ADMIN_TOKEN（Cloudflare secret 中配置）</p>
  <div class="row">
    <input type="password" id="tokenIn" placeholder="ADMIN_TOKEN" style="flex:1">
    <button id="btnLogin">登录</button>
  </div>
  <p id="loginErr" style="color:#fca5a5;font-size:12px"></p>
</div>

<main id="app" style="display:none">
  <div class="card">
    <h2>设备列表（每 5 秒自动刷新）</h2>
    <div id="retiredHint" style="display:none;margin-bottom:8px;font-size:12px;color:#94a3b8;background:#0b1220;border:1px solid #334155;border-radius:6px;padding:6px 10px">
      <span id="retiredText"></span>
      <button class="sm" onclick="toggleRetired()">展开</button>
      <button class="sm" onclick="cleanupNow()">立即清理</button>
    </div>
    <table>
      <thead><tr><th>设备</th><th>硬件</th><th>部署状态</th><th>操作</th></tr></thead>
      <tbody id="devRows"></tbody>
    </table>
    <h2 style="margin-top:18px">部署进度日志 <span id="logWho" class="mono" style="color:#64748b"></span></h2>
    <div id="logbox">（点击设备行的「日志」查看）</div>
  </div>

  <div class="col-right">
    <div class="card">
      <h2>直连聊天（经 CF 隧道 → 机器模型 API）</h2>
      <div class="row" style="margin-bottom:10px">
        <select id="chatDev"></select>
        <span id="chatMeta" class="mono" style="color:#64748b"></span>
      </div>
      <div id="chatbox"></div>
      <div class="chatin">
        <input type="text" id="chatIn" placeholder="输入消息，回车发送…">
        <button id="btnSend">发送</button>
      </div>
    </div>

    <div class="card">
      <h2>批次安装码（基础镜像批量装机）</h2>
      <div class="row" style="margin-bottom:8px">
        <span style="font-size:12px;color:#64748b">在模板机执行一键命令 → 关机做层镜像 → 换机开机自动注册（首启自领设备码，免逐台安装）。生成批次码请点右上角「批次安装码」。</span>
      </div>
      <table class="batch-table">
        <thead><tr><th>批次码</th><th>用量</th><th>有效期</th><th>操作</th></tr></thead>
        <tbody id="batchRows"></tbody>
      </table>
      <div id="batchHint" style="margin-top:8px;font-size:12px;color:#64748b"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem("cc_admin_token") || "";
let devices = [], engines = {}, logDevice = null, logTimer = null;

function toast(msg, ok=true) {
  const t = $("toast"); t.textContent = msg;
  t.style.background = ok ? "#065f46" : "#7f1d1d";
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 5000);
}

async function api(path, opts={}) {
  opts.headers = { ...(opts.headers||{}), "Authorization": "Bearer " + token,
                   "Content-Type": "application/json" };
  const r = await fetch(path, opts);
  if (r.status === 401) { showLogin(); throw new Error("unauthorized"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function showLogin() { $("login").style.display = "block"; $("app").style.display = "none"; }
function showApp()   { $("login").style.display = "none"; $("app").style.display = "grid"; }

$("btnLogin").onclick = async () => {
  token = $("tokenIn").value.trim();
  try { await api("/api/admin/devices"); localStorage.setItem("cc_admin_token", token); showApp(); refresh(); }
  catch (e) { $("loginErr").textContent = "登录失败: " + e.message; }
};
$("btnLogout").onclick = () => { localStorage.removeItem("cc_admin_token"); token=""; showLogin(); };

$("btnAddDev").onclick = async () => {
  const label = prompt("设备备注（可空）:") || "";
  try {
    const j = await api("/api/admin/devices/new", { method: "POST", body: JSON.stringify({ label }) });
    prompt("在该机器上执行以下命令完成安装（root）：", j.install_command);
  } catch (e) { toast(e.message, false); }
};

$("btnBatch").onclick = async () => {
  const quotaIn = prompt("批次配额（允许注册的设备台数，不填=无限）:", "");
  if (quotaIn === null) return;
  const quota = quotaIn.trim() === "" ? null : parseInt(quotaIn, 10);
  if (quota !== null && !(quota >= 1)) { toast("配额需为 >=1 的整数（不填=无限）", false); return; }
  const label = prompt("批次备注（可空，如：门店A-20260929）:") || "";
  const daysIn = prompt("有效期（天，可空=永不过期）:", "");
  const body = { label };
  if (quota !== null) body.quota = quota;
  if (daysIn && !isNaN(parseInt(daysIn, 10)) && parseInt(daysIn, 10) > 0)
    body.expires = Math.floor(Date.now()/1000) + parseInt(daysIn, 10) * 86400;
  try {
    const j = await api("/api/admin/batches", { method: "POST", body: JSON.stringify(body) });
    toast("批次码已生成: " + j.code);
    const cmd = installCmd(j.code);
    $("batchHint").innerHTML = `新批次 <b class="mono">${esc(j.code)}</b>（配额 ${j.quota == null ? "∞ 无限" : j.quota}${j.expires ? "，有效期至 " + new Date(j.expires*1000).toLocaleString() : ""}）已生成。<br>
      <div style="margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <input readonly class="mono" style="flex:1;min-width:300px;background:#0f172a;color:#7dd3fc;border:1px solid #475569;border-radius:6px;padding:5px 8px;font-size:12px" value="${esc(cmd)}" id="newBatchCmd">
        <button class="sm" onclick="copyCmd('${esc(j.code)}', this)">复制命令</button>
      </div>
      <div style="margin-top:6px">在目标机（root，无需预装任何脚本）直贴执行：自动拉取 install.sh、以批次码 ${esc(j.code)} 向 <span class="mono">/api/device/provision</span> 注册并领取 cck- 设备密钥、安装 agent。复制后可直接粘贴到目标机终端。</div>`;
    loadBatches();
  } catch (e) { toast(e.message, false); }
};

async function loadBatches() {
  try {
    const j = await api("/api/admin/batches");
    $("batchRows").innerHTML = j.batches.map(b => {
      const full = b.quota != null && (b.used || 0) >= b.quota;
      const expired = b.expired;
      const st = expired ? "已过期" : full ? "已满" : "可用";
      const cls = (expired || full) ? "failed" : "online";
      return `<tr>
        <td><span class="mono">${esc(b.code)}</span>${b.label ? `<br><span style="color:#64748b;font-size:11px">${esc(b.label)}</span>` : ""}</td>
        <td>${b.used}/${b.quota == null ? "∞" : b.quota} <span class="state ${cls}">${st}</span></td>
        <td>${b.expires ? new Date(b.expires*1000).toLocaleDateString() : "永久"}</td>
        <td><div class="row">
          <button class="sm" onclick="copyCmd('${esc(b.code)}', this)">复制命令</button>
          <button class="sm red" onclick="delBatch('${esc(b.code)}')">删除</button>
        </div></td>
      </tr>`;
    }).join("") || `<tr><td colspan="4" style="color:#64748b">暂无批次。点「生成批次码」创建。</td></tr>`;
  } catch (e) { /* 401 由 api() 统一处理 */ }
}

// ---------- 批次一键安装命令（裸机 curl 拉脚本 + --batch 装机）+ 复制 ----------
// API_BASE 取当前访问域名（项目惯例：配置随请求来源下发；生产=固定域名，本地沙箱=当前 origin）
// 目标机无需预装 install.sh：curl 拉取原始脚本后以 --batch 进入批次模式，
// ---batch 模式由云管 /api/device/provision 按 machine-id 颁发 cck- 设备密钥并安装 agent。
function installCmd(code) {
  const api = location.origin;
  return `curl -fsSL '${api}/install.sh?batch=${code}' | bash -s -- --batch ${code} --api-base ${api}`;
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
  return Promise.resolve(ok);
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 降级 */ }
  return fallbackCopy(text);
}

window.copyCmd = async (code, btn) => {
  const cmd = installCmd(code);
  const ok = await copyText(cmd);
  if (btn) {
    btn.textContent = ok ? "已复制 ✓" : "复制失败";
    setTimeout(() => { btn.textContent = "复制命令"; }, 1500);
  }
  toast(ok ? "一键安装命令已复制，可在目标机终端直贴执行" : "复制失败，请手动选择命令文本", ok);
};

window.delBatch = async code => {
  if (!confirm(`删除批次 ${code}？\n已注册的设备记录与 agent 心跳不受影响（仅删除批次码，之后该码无法再 provision 新机）。`)) return;
  try {
    const j = await api("/api/admin/batches/" + encodeURIComponent(code), { method: "DELETE" });
    toast(j.removed ? "批次已删除: " + code : "批次不存在（已刷新）");
    loadBatches();
  } catch (e) { toast(e.message, false); }
};

function ago(ts) {
  if (!ts) return "-";
  const s = Math.floor(Date.now()/1000) - ts;
  if (s < 60) return s + "s前";
  if (s < 3600) return Math.floor(s/60) + "m前";
  return Math.floor(s/3600) + "h前";
}

async function refresh() {
  try {
    const j = await api("/api/admin/devices" + (showRetired ? "?include_retired=1" : ""));
    devices = j.devices; engines = j.engines || {};
    retiredHidden = j.retired_hidden || 0;
    renderRetiredHint();
    renderDevices(); renderChatDevs(); loadBatches();
  } catch (e) { /* token 失效会自行跳登录 */ }
}

// ---------- 离线设备退役隐藏（t35） ----------
let showRetired = false;   // 展开退役设备（?include_retired=1）
let retiredHidden = 0;     // 列表默认隐藏的退役离线设备数（>7 天）

function renderRetiredHint() {
  const el = $("retiredHint");
  if (!el) return;
  if (!showRetired && retiredHidden > 0) {
    el.style.display = "block";
    $("retiredText").textContent = `已隐藏 ${retiredHidden} 台离线设备（>7 天）`;
    $("retiredHint").querySelector("button").textContent = "展开";
  } else if (showRetired) {
    el.style.display = "block";
    $("retiredText").textContent = `已显示全部设备（含退役离线设备）`;
    $("retiredHint").querySelector("button").textContent = "收起";
  } else {
    el.style.display = "none";
  }
}

window.toggleRetired = () => { showRetired = !showRetired; refresh(); };

window.cleanupNow = async () => {
  try {
    const j = await api("/api/admin/devices/cleanup", { method: "POST" });
    toast(`离线清理完成：清除 ${j.purged} 台，退役 ${j.retired} 台`);
    refresh();
  } catch (e) { toast(e.message, false); }
};

function renderDevices() {
  $("devRows").innerHTML = devices.map(d => {
    const dep = d.deploy || {};
    const isOn = d.online === true;   // 心跳语义：状态列主状态 = 在线/离线（非部署状态）
    const hwBase = [d.cpu, d.gpu ? d.gpu + " " + Math.round((d.gpu_mem_mb||0)/1024) + "G" : "", d.mem_total_gb ? d.mem_total_gb + "G 内存" : ""]
      .filter(Boolean).join("<br>");
    // 物理网卡行（多网卡多行；缺失字段跳过该段）+ 云侧来源外网 IP 行
    const netRows = (d.net || []).map(n => {
      const seg = [n.iface, n.ip, n.mac].filter(Boolean).join(" · ");
      return seg ? esc(seg) : "";
    }).filter(Boolean).join("<br>");
    const extIp = d.remote_ip ? `外网 ${esc(d.remote_ip)}` : "";
    const hw = [hwBase, netRows, extIp].filter(Boolean).join("<br>");
    const usage = isOn ? usageBars(d.usage || {}) : "";
    const depPct = deployPct(dep);
    const depBar = (isOn && dep.state && !["idle","stopped"].includes(dep.state))
      ? barHtml(depPct + "%", depPct, dep.state === "failed" ? "crit" : dep.state === "online" ? "okgreen" : "blue") : "";
    // 部署状态/进度条仅在设备在线时展示；离线明确显示「离线」，不残留旧的 dep.state=online
    const deployInfo = isOn ? `
      <br><span class="state ${dep.state||"idle"}">${dep.state||"idle"}</span>${depBar}
      <br><span style="font-size:12px;color:#94a3b8">${esc(dep.engine||"")} ${esc(dep.model||"")} ${esc(dep.step||"")} ${esc(dep.step_state||"")}<br>${esc(dep.detail||"")}</span>
      ${safeUrl(dep.tunnel_url) ? `<br><a class="mono" href="${esc(dep.tunnel_url)}" target="_blank" rel="noopener">${esc(dep.tunnel_url)}</a>` : ""}` : "";
    return `<tr>
      <td><span class="dot ${isOn ? "on" : "off"}"></span><b>${esc(d.hostname||"-")}</b>
          ${d.batch ? `<span class="state idle">批次 ${esc(d.batch)}</span>` : ""}<br>
          <span class="mono" style="color:#64748b">${d.device_id} · agent v${esc(d.agent_version||"?")} · ${ago(d.last_seen)}</span></td>
      <td style="font-size:12px;color:#94a3b8">${hw || "-"}${usage}</td>
      <td><span class="state ${isOn ? "online" : "offline"}">${isOn ? "在线" : "离线"}</span>${deployInfo}</td>
      <td><div class="row">
        <select id="e_${d.device_id}" onchange="engineChanged('${d.device_id}')">${Object.keys(engines).map(e => `<option value="${e}" ${e === (dep.engine||"ollama") ? "selected" : ""}>${e}</option>`).join("")}</select>
        <select id="m_${d.device_id}">${(engines[dep.engine||"ollama"]||[]).map(m => `<option ${m === (dep.model||"") ? "selected" : ""}>${m}</option>`).join("")}</select>
        <button class="sm" onclick="deploy('${d.device_id}')">部署</button>
        <button class="sm gray" onclick="cmd('${d.device_id}','restart_tunnel')">重建隧道</button>
        <button class="sm gray" onclick="cmd('${d.device_id}','stop')">停止</button>
        <button class="sm gray" onclick="viewLog('${d.device_id}')">日志</button>
        <button class="sm red" onclick="delDev('${d.device_id}')">删除</button>
      </div></td>
    </tr>`;
  }).join("") || `<tr><td colspan="4" style="color:#64748b">暂无设备。点右上角「+ 添加设备」获取安装命令。</td></tr>`;
}

function renderChatDevs() {
  // 聊天下拉：仅心跳在线（d.online）且存在可用隧道（含 model_api_key 依赖的 deploy 全量上报）的设备
  const online = devices.filter(d => d.online === true && d.deploy && safeUrl(d.deploy.tunnel_url));
  const sel = $("chatDev");
  const cur = sel.value;
  sel.innerHTML = online.map(d => `<option value="${d.device_id}">${esc(d.hostname||d.device_id)}（${esc(d.deploy.engine||"")} · ${esc(d.deploy.model||"")}）</option>`).join("");
  if (online.find(d => d.device_id === cur)) sel.value = cur;
  const d = online.find(x => x.device_id === sel.value);
  $("chatMeta").textContent = d ? `${d.deploy.engine||""} ${d.deploy.tunnel_url}` : "无在线模型设备";
}

window.engineChanged = id => {
  const e = $("e_" + id).value;
  const m = $("m_" + id);
  m.innerHTML = (engines[e]||[]).map(x => `<option>${x}</option>`).join("");
  const dep = (devices.find(d => d.device_id === id)||{}).deploy||{};
  if (engines[e] && engines[e].includes(dep.model)) m.value = dep.model;
};
window.deploy = async id => {
  const engine = $("e_" + id).value;
  const model = $("m_" + id).value;
  if (!confirm(`在设备 ${id} 上部署 ${engine} · ${model}？`)) return;
  try { await api("/api/admin/deploy", { method: "POST", body: JSON.stringify({ device_id: id, engine, model }) });
        toast("部署指令已下发，等待设备拉取执行"); viewLog(id); setTimeout(refresh, 1000); }
  catch (e) { toast(e.message, false); }
};
window.cmd = async (id, type) => {
  try { await api("/api/admin/command", { method: "POST", body: JSON.stringify({ device_id: id, type }) });
        toast("指令已下发: " + type); }
  catch (e) { toast(e.message, false); }
};
window.delDev = async id => {
  if (!confirm("删除设备 " + id + " 的记录？（不会卸载机器上的脚本）")) return;
  try {
    await api("/api/admin/device/" + id, { method: "DELETE" });
    if (logDevice === id) { clearInterval(logTimer); logTimer = null; logDevice = null; $("logWho").textContent = ""; $("logbox").textContent = "（点击设备行的「日志」查看）"; }
    refresh();
  } catch (e) { toast(e.message, false); }
};
window.viewLog = id => {
  logDevice = id; $("logWho").textContent = "· " + id;
  if (logTimer) clearInterval(logTimer);
  const load = async () => {
    try {
      const j = await api("/api/admin/device/" + id);
      $("logbox").innerHTML = j.logs.map(l =>
        `<div>[${new Date(l.ts*1000).toLocaleTimeString()}] <b>${l.step}</b> ${l.state} — ${esc(l.detail)}</div>`).join("")
        || "（暂无日志）";
      $("logbox").scrollTop = $("logbox").scrollHeight;
    } catch (e) {}
  };
  load(); logTimer = setInterval(load, 3000);
};

// ---------- 进度条 ----------
function barHtml(text, pct, cls=null) {
  if (pct == null || isNaN(pct)) return "";
  const c = cls === null ? (pct >= 90 ? "crit" : pct >= 70 ? "warn" : "") : cls;
  return `<div class="bar ${c}"><i style="width:${Math.min(100, Math.max(0, pct))}%"></i><span>${text}</span></div>`;
}
function usageBars(u) {
  const gpuMem = u.gpu_mem_total_mb
    ? `显存${(u.gpu_mem_used_mb/1024).toFixed(1)}/${Math.round(u.gpu_mem_total_mb/1024)}G` : "";
  return barHtml(`CPU ${u.cpu_pct ?? "-"}%`, u.cpu_pct)
       + barHtml(`内存 ${u.mem_used_gb ?? "-"}/${u.mem_total_gb ?? "-"}G ${u.mem_pct ?? "-"}%`, u.mem_pct)
       + (u.gpu_util_pct != null ? barHtml(`GPU ${u.gpu_util_pct}% ${gpuMem}`, u.gpu_util_pct) : "");
}
// 部署节点 → 总进度权重（model_pull/engine_start/strata_setup 占 50~90；vllm/sglang 引擎步含权重下载）
const STEP_W = { gpu_check: 5, docker: 10, mirrors: 15, gpu_toolkit: 25, pull_images: 40,
                 engine_start: 50, model_pull: 90, strata_check: 30, strata_setup: 50, strata_start: 90,
                 gateway: 94, tunnel: 97, verify: 100 };
function deployPct(dep) {
  if (!dep || !dep.state) return 0;
  if (dep.state === "online") return 100;
  if (dep.state === "queued") return 2;
  if (dep.state === "idle" || dep.state === "stopped") return 0;
  if (dep.step === "model_pull" || dep.step === "engine_start" || dep.step === "strata_setup") {
    // vllm/sglang 没有独立 model_pull：engine_start 即含权重下载，直接给 90 档
    if (dep.step === "engine_start" && dep.engine && dep.engine !== "ollama") return 90;
    const m = /(\d+)\s*%/.exec(dep.detail || "");
    if (m) return Math.min(90, 50 + Math.round(40 * parseInt(m[1]) / 100));
  }
  return STEP_W[dep.step] ?? 0;
}

// ---------- 聊天 ----------
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
// 隧道地址来自设备上报（不可信）：仅放行 http/https 绝对 URL，防 javascript:/data: 注入
function safeUrl(u) {
  if (!u) return "";
  try {
    const p = new URL(String(u), window.location.origin);
    return (p.protocol === "https:" || p.protocol === "http:") ? String(u) : "";
  } catch { return ""; }
}
function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.textContent = text;
  $("chatbox").appendChild(d);
  $("chatbox").scrollTop = $("chatbox").scrollHeight;
  return d;
}
// 聊天性能实测（四引擎通用，SSE 流式统一口径）：
// - TTFT 首字延迟 = 请求发出 → 首个含 content 的 SSE chunk 到达（毫秒）
// - tok/s = 累计 tokens ÷ 生成耗时（首字到达 → 末字到达），流式统计
// - token 数优先取 SSE 末块 usage.completion_tokens（vllm/sglang/ollama 均支持
//   stream_options.include_usage；strata 为 OpenAI 兼容实现同协议），缺失时按
//   CJK 每字≈1 token + 其余按 4 字符≈1 token 估算（统一口径，避免按 chunk 数偏差）
function estTokens(s) {
  if (!s) return 0;
  const cjk = (s.match(/[\u4e00-\u9fff]/g) || []).length;
  const rest = s.replace(/[\u4e00-\u9fff]/g, " ").replace(/\s+/g, " ").trim();
  return cjk + (rest ? Math.max(1, Math.round(rest.length / 4)) : 0);
}
let chatPerfLast = null;                 // 上次测量值（跨设备保留，用于「上次」对照）
let chatPerfCum = { msgs: 0, toks: 0 };  // 累计值
function perfLine(bot, j) {
  const tok = (j.usage && j.usage.completion_tokens != null)
    ? j.usage.completion_tokens : estTokens(j.content || "");
  const tps = j.genMs > 0 ? tok / (j.genMs / 1000) : 0;
  const line = document.createElement("div");
  line.className = "perf";
  line.textContent = `⏱ TTFT ${j.ttft}ms · ${tps.toFixed(1)} tok/s · ${tok} tok`
    + (chatPerfLast ? `（上次 ${chatPerfLast.ttft}ms · ${chatPerfLast.tps.toFixed(1)} tok/s）` : "")
    + ` · 累计 ${chatPerfCum.toks + tok} tok`;
  bot.appendChild(line);
  chatPerfLast = { ttft: j.ttft, tps, tok };
  chatPerfCum.msgs += 1;
  chatPerfCum.toks += tok;
  $("chatbox").scrollTop = $("chatbox").scrollHeight;
}
async function send() {
  const id = $("chatDev").value;
  const d = devices.find(x => x.device_id === id);
  const text = $("chatIn").value.trim();
  if (!text) return;
  const turl = safeUrl(d && d.online === true && d.deploy && d.deploy.tunnel_url);
  if (!turl) { toast("该设备没有可用隧道地址", false); return; }
  $("chatIn").value = "";
  addMsg("user", text);
  const bot = addMsg("bot", "…");
  const ctrl = new AbortController();
  const t0 = performance.now();
  const timer = setTimeout(() => ctrl.abort(), 300000); // 长生成超时保护（strata 冷启动/长文放宽到 5min）
  let firstTokAt = null, lastTokAt = null, content = "", usage = null;
  try {
    const r = await fetch(turl + "/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json",
                 "Authorization": "Bearer " + (d.deploy.model_api_key || "") },
      body: JSON.stringify({
        model: d.deploy.model,
        messages: [{ role: "user", content: text }],
        stream: true,
        stream_options: { include_usage: true },   // 让 vllm/sglang/ollama 在末块带 usage；strata 同协议
      }),
      signal: ctrl.signal,
    });
    const ct = r.headers.get("content-type") || "";
    if (!r.ok || !r.body || !ct.includes("text/event-stream")) {
      // 非流式回退（引擎不支持 SSE 时）：一次性 JSON，TTFT 即整体耗时
      const raw = await r.text();
      let j = {};
      try { j = raw ? JSON.parse(raw) : {}; }
      catch { throw new Error("HTTP " + r.status + "，响应非 JSON: " + raw.slice(0, 200)); }
      if (!r.ok) throw new Error("HTTP " + r.status + " " + (j.error && j.error.message || "(空响应)"));
      if (!j.choices || !j.choices[0]) throw new Error("HTTP " + r.status + " 响应格式异常: " + raw.slice(0, 200));
      content = j.choices[0].message.content || "";
      firstTokAt = lastTokAt = performance.now();
      usage = j.usage || null;
      bot.textContent = content;
    } else {
      // SSE 流解析（统一口径）：按 data: 行解析，首个含 content 的 delta 记为首字
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).replace(/\r$/, "");
          buf = buf.slice(idx + 1);
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          let j = {};
          try { j = JSON.parse(payload); } catch { continue; }
          const delta = j.choices && j.choices[0] && j.choices[0].delta;
          const piece = delta && delta.content ? delta.content : "";
          const now = performance.now();
          if (piece) {
            if (firstTokAt === null) firstTokAt = now;
            lastTokAt = now;
            content += piece;
            bot.textContent = content;
          }
          if (j.usage && j.usage.completion_tokens != null) usage = j.usage;
        }
      }
    }
    if (firstTokAt === null) throw new Error("流式响应无任何内容 token");
    const j = {
      ttft: Math.max(1, Math.round(firstTokAt - t0)),   // 请求发出 → 首个 token chunk
      genMs: Math.max(1, lastTokAt - firstTokAt),       // 生成耗时（首→末）
      content,
      usage,
    };
    bot.textContent = content;
    perfLine(bot, j);
  } catch (e) {
    bot.textContent = "❌ " + (e.name === "AbortError" ? "请求超时（300s），请确认设备在线且隧道存活" : e.message);
  } finally {
    clearTimeout(timer);
  }
}
$("btnSend").onclick = send;
$("chatIn").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

// ---------- 变速刷新：部署中 2s，平时 5s，页面隐藏时暂停 ----------
let refreshTimer = null;
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  // 变速刷新：仅在线设备处于部署中/排队时 2s 快轮询（离线设备进度不会推进）
  const active = devices.some(d => d.online === true && ["queued", "deploying"].includes((d.deploy || {}).state));
  refreshTimer = setTimeout(async () => {
    if (!document.hidden) await refresh();
    scheduleRefresh();
  }, active ? 2000 : 5000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) refresh(); });

// ---------- 启动 ----------
if (token) {
  api("/api/admin/devices").then(() => { showApp(); refresh(); scheduleRefresh(); })
    .catch(() => showLogin());
} else showLogin();
</script>
